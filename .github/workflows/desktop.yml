name: Desktop packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  checks:
    name: Tests and web build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            packaging/requirements-build.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "pytest>=8" "httpx>=0.27" "ruff>=0.6"

      - name: Backend tests
        working-directory: backend
        run: python -m pytest -q

      - name: Backend lint
        working-directory: backend
        run: python -m ruff check app tests

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Type-check web UI
        working-directory: web
        run: npm run lint

      - name: Build web UI
        working-directory: web
        run: npm run build

      - name: Upload built web UI
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error
          retention-days: 7

  linux:
    name: Build Linux packages
    needs: checks
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Download built web UI
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libfuse2 \
            patchelf \
            rpm \
            fakeroot

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            packaging/requirements-build.txt

      - name: Install sidecar build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r packaging/requirements-build.txt

      - name: Build backend sidecar
        run: |
          pyinstaller --noconfirm --clean \
            --distpath packaging/dist \
            --workpath packaging/build \
            packaging/filepilot-backend.spec
          file packaging/dist/filepilot-backend
          mkdir -p desktop/src-tauri/binaries
          cp packaging/dist/filepilot-backend \
            desktop/src-tauri/binaries/filepilot-backend-x86_64-unknown-linux-gnu
          chmod +x desktop/src-tauri/binaries/filepilot-backend-x86_64-unknown-linux-gnu

      - name: Smoke-test the sidecar
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          FILEPILOT_DATA_DIR="$tmp" \
            FILEPILOT_IMPORT_LEGACY=false \
            FILEPILOT_HOST=127.0.0.1 \
            FILEPILOT_PORT=6970 \
            FILEPILOT_TLS=off \
            ./desktop/src-tauri/binaries/filepilot-backend-x86_64-unknown-linux-gnu \
            >"$tmp/sidecar.log" 2>&1 &
          server_pid=$!
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:6970/api/health >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:6970/api/health
          curl -fsS http://127.0.0.1:6970/ | grep -qi "<!doctype html"
          kill "$server_pid" 2>/dev/null || true
          for _ in $(seq 1 10); do
            kill -0 "$server_pid" 2>/dev/null || break
            sleep 1
          done
          kill -9 "$server_pid" 2>/dev/null || true
          wait "$server_pid" 2>/dev/null || true
          cat "$tmp/sidecar.log"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Build Linux bundles
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --bundles deb,rpm,appimage

      - name: Collect packages and checksums
        run: |
          mkdir -p dist-linux
          cp desktop/src-tauri/target/release/bundle/deb/*.deb dist-linux/
          cp desktop/src-tauri/target/release/bundle/rpm/*.rpm dist-linux/
          cp desktop/src-tauri/target/release/bundle/appimage/*.AppImage dist-linux/
          cp desktop/src-tauri/target/release/bundle/appimage/*.AppImage.sig dist-linux/
          cd dist-linux
          sha256sum *.deb *.rpm *.AppImage *.sig > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: filepilot-linux-x86_64
          path: dist-linux/*
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Build Windows packages
    needs: checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download built web UI
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            packaging/requirements-build.txt

      - name: Install sidecar build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r packaging/requirements-build.txt

      - name: Build backend sidecar (Windows)
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean `
            --distpath packaging/dist `
            --workpath packaging/build `
            packaging/filepilot-backend.spec
          New-Item -ItemType Directory -Force -Path desktop\src-tauri\binaries
          copy packaging\dist\filepilot-backend.exe desktop\src-tauri\binaries\filepilot-backend-x86_64-pc-windows-msvc.exe

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Install NSIS
        run: choco install nsis --version 3.09 --no-progress

      - name: Build Windows bundles
        shell: pwsh
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --bundles nsis,msi

      - name: Collect packages and checksums
        shell: pwsh
        run: |
          mkdir dist-windows
          copy desktop\src-tauri\target\release\bundle\nsis\*.exe dist-windows\
          copy desktop\src-tauri\target\release\bundle\nsis\*.exe.sig dist-windows\
          copy desktop\src-tauri\target\release\bundle\msi\*.msi dist-windows\
          copy desktop\src-tauri\target\release\bundle\msi\*.msi.sig dist-windows\
          cd dist-windows
          Get-ChildItem -File | Where-Object { $_.Name -ne 'SHA256SUMS.txt' } |
            Sort-Object Name |
            ForEach-Object {
              $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
              "$hash  $($_.Name)"
            } | Set-Content SHA256SUMS.txt
          type SHA256SUMS.txt

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: filepilot-windows-x86_64
          path: dist-windows/*
          if-no-files-found: error
          retention-days: 14

  release-artifacts:
    name: Prepare release artifacts
    needs: [linux, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: filepilot-linux-x86_64
          path: artifacts-linux
      - uses: actions/download-artifact@v4
        with:
          name: filepilot-windows-x86_64
          path: artifacts-windows
      - name: Combine artifacts
        run: |
          mkdir -p release-artifacts
          cp artifacts-linux/* release-artifacts/
          cp artifacts-windows/* release-artifacts/
          rm -f release-artifacts/SHA256SUMS.txt

      - name: Generate updater manifest
        run: |
          python3 - <<'PY'
          import datetime
          import glob
          import json
          import os
          import sys

          tag = os.environ["GITHUB_REF_NAME"]
          version = tag.lstrip("v")
          repo = os.environ["GITHUB_REPOSITORY"]
          base = f"https://github.com/{repo}/releases/download/{tag}"

          platforms = {}

          def add(key, pattern):
              matches = glob.glob(f"release-artifacts/{pattern}")
              if not matches:
                  return
              path = matches[0]
              sig = f"{path}.sig"
              if not os.path.exists(sig):
                  sys.exit(f"Missing signature for {path}")
              with open(sig, encoding="utf-8") as handle:
                  signature = handle.read().strip()
              platforms[key] = {
                  "signature": signature,
                  "url": f"{base}/{os.path.basename(path)}",
              }

          add("linux-x86_64", "*.AppImage")
          add("windows-x86_64", "*setup.exe")

          if not platforms:
              sys.exit("No updater artifacts found")

          manifest = {
              "version": version,
              "notes": f"FilePilot {version}",
              "pub_date": datetime.datetime.now(datetime.timezone.utc)
              .isoformat(timespec="seconds")
              .replace("+00:00", "Z"),
              "platforms": platforms,
          }
          with open("release-artifacts/latest.json", "w", encoding="utf-8") as handle:
              json.dump(manifest, handle, indent=2)
              handle.write("\n")
          print(json.dumps(manifest, indent=2))
          PY

      - name: Generate checksums
        run: |
          cd release-artifacts
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\n' |
            sort |
            xargs sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: filepilot-release-${{ github.ref_name }}
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish GitHub Release
    needs: release-artifacts
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    environment: release
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: filepilot-release-${{ github.ref_name }}
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          fail_on_unmatched_files: true