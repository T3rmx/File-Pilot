name: Desktop packages

# Branch and release model
# ------------------------
#   main     development and fast iteration. Pushing here never builds packages.
#   beta     pre-release channel. Every push builds <VERSION>-beta.<run> and
#            publishes it as a GitHub prerelease, with no manual approval.
#   release  stable channel. A final release is built from a vX.Y.Z tag (or a
#            manual "release" run on this branch) and waits for approval on the
#            `release` environment before it is published.
#
# VERSION at the repository root is the only version source of truth. Change it
# with `python scripts/version.py bump ...`; never edit the manifests by hand.

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "artifacts = build only, beta = prerelease, release = final release"
        type: choice
        options:
          - artifacts
          - beta
          - release
        default: artifacts
      version:
        description: "Final version for the release channel (leave empty to use VERSION)"
        type: string
        required: false
  push:
    branches:
      - beta
    tags:
      - "v*"

# Tag builds must never be cancelled by a newer push; branch builds may be.
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  meta:
    name: Resolve version and channel
    runs-on: ubuntu-22.04
    outputs:
      channel: ${{ steps.resolve.outputs.channel }}
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      publish: ${{ steps.resolve.outputs.publish }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version and channel
        id: resolve
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_CHANNEL: ${{ inputs.channel }}
          INPUT_VERSION: ${{ inputs.version }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail

          base="$(python3 scripts/version.py show)"
          case "$base" in
            *-*) echo "::error::VERSION must be a plain X.Y.Z (found $base)"; exit 1 ;;
          esac

          channel="artifacts"
          version=""
          tag=""
          publish="false"

          if [ "$EVENT" = "push" ] && [ "$REF_TYPE" = "tag" ]; then
            tag="$REF_NAME"
            version="${tag#v}"
            case "$version" in
              *-beta.*) channel="beta" ;;
              *)        channel="release" ;;
            esac
          elif [ "$EVENT" = "push" ]; then
            # Push to the beta branch: auto-version and publish a prerelease.
            channel="beta"
            version="${base}-beta.${RUN_NUMBER}"
            tag="v${version}"
          else
            channel="${INPUT_CHANNEL:-artifacts}"
            case "$channel" in
              artifacts)
                version="$base"
                ;;
              beta)
                version="${base}-beta.${RUN_NUMBER}"
                tag="v${version}"
                ;;
              release)
                version="${INPUT_VERSION:-$base}"
                tag="v${version}"
                ;;
              *)
                echo "::error::unknown channel '$channel'"
                exit 1
                ;;
            esac
          fi

          if [ "$channel" = "beta" ]; then
            case "$version" in
              *-beta.*) ;;
              *) echo "::error::beta version must be X.Y.Z-beta.N (got $version)"; exit 1 ;;
            esac
            base_part="${version%%-beta.*}"
          else
            base_part="$version"
          fi

          if [ "$base_part" != "$base" ]; then
            echo "::error::version $version does not match VERSION ($base)."
            echo "Run: python scripts/version.py set $base_part and commit it first."
            exit 1
          fi

          if [ "$EVENT" = "workflow_dispatch" ]; then
            if [ "$channel" = "beta" ] && [ "$REF_NAME" != "beta" ]; then
              echo "::error::select the beta branch to publish a beta"
              exit 1
            fi
            if [ "$channel" = "release" ] && [ "$REF_NAME" != "release" ]; then
              echo "::error::select the release branch to publish a final release"
              exit 1
            fi
          fi

          if [ "$channel" = "artifacts" ]; then
            publish="false"
          else
            publish="true"
          fi

          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "Building channel=$channel version=$version tag=${tag:-none} publish=$publish"

  checks:
    name: Tests and web build
    needs: meta
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            packaging/requirements-build.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "pytest>=8" "httpx>=0.27" "ruff>=0.6"

      - name: Check version manifests
        run: python scripts/version.py check

      - name: Stamp build version
        run: python scripts/version.py set "${{ needs.meta.outputs.version }}"

      - name: Backend tests
        working-directory: backend
        run: python -m pytest -q

      - name: Backend lint
        working-directory: backend
        run: python -m ruff check app tests

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Type-check web UI
        working-directory: web
        run: npm run lint

      - name: Build web UI
        working-directory: web
        run: npm run build

      - name: Upload built web UI
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error
          retention-days: 7

  linux:
    name: Build Linux packages
    needs: [meta, checks]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Download built web UI
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libfuse2 \
            patchelf \
            rpm \
            fakeroot

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            packaging/requirements-build.txt

      - name: Stamp build version
        run: python scripts/version.py set "${{ needs.meta.outputs.version }}"

      - name: Install sidecar build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r packaging/requirements-build.txt

      - name: Build backend sidecar
        run: |
          pyinstaller --noconfirm --clean \
            --distpath packaging/dist \
            --workpath packaging/build \
            packaging/filepilot-backend.spec
          file packaging/dist/filepilot-backend
          mkdir -p desktop/src-tauri/binaries
          cp packaging/dist/filepilot-backend \
            desktop/src-tauri/binaries/filepilot-backend-x86_64-unknown-linux-gnu
          chmod +x desktop/src-tauri/binaries/filepilot-backend-x86_64-unknown-linux-gnu

      - name: Smoke-test the sidecar
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          FILEPILOT_DATA_DIR="$tmp" \
            FILEPILOT_IMPORT_LEGACY=false \
            FILEPILOT_HOST=127.0.0.1 \
            FILEPILOT_PORT=6970 \
            FILEPILOT_TLS=off \
            ./desktop/src-tauri/binaries/filepilot-backend-x86_64-unknown-linux-gnu \
            >"$tmp/sidecar.log" 2>&1 &
          server_pid=$!
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:6970/api/health >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:6970/api/health
          curl -fsS http://127.0.0.1:6970/ | grep -qi "<!doctype html"
          kill "$server_pid" 2>/dev/null || true
          for _ in $(seq 1 10); do
            kill -0 "$server_pid" 2>/dev/null || break
            sleep 1
          done
          kill -9 "$server_pid" 2>/dev/null || true
          wait "$server_pid" 2>/dev/null || true
          cat "$tmp/sidecar.log"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Build Linux bundles
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --bundles deb,rpm,appimage

      - name: Collect packages and checksums
        run: |
          mkdir -p dist-linux
          cp desktop/src-tauri/target/release/bundle/deb/*.deb dist-linux/
          cp desktop/src-tauri/target/release/bundle/rpm/*.rpm dist-linux/
          cp desktop/src-tauri/target/release/bundle/appimage/*.AppImage dist-linux/
          cp desktop/src-tauri/target/release/bundle/appimage/*.AppImage.sig dist-linux/
          cd dist-linux
          sha256sum *.deb *.rpm *.AppImage *.sig > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: filepilot-linux-x86_64
          path: dist-linux/*
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Build Windows packages
    needs: [meta, checks]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download built web UI
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            packaging/requirements-build.txt

      - name: Stamp build version
        run: python scripts/version.py set "${{ needs.meta.outputs.version }}"

      - name: Install sidecar build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r packaging/requirements-build.txt

      - name: Build backend sidecar (Windows)
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean `
            --distpath packaging/dist `
            --workpath packaging/build `
            packaging/filepilot-backend.spec
          New-Item -ItemType Directory -Force -Path desktop\src-tauri\binaries
          copy packaging\dist\filepilot-backend.exe desktop\src-tauri\binaries\filepilot-backend-x86_64-pc-windows-msvc.exe

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Install NSIS
        run: choco install nsis --version 3.09 --no-progress

      - name: Build Windows bundles
        shell: pwsh
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CHANNEL: ${{ needs.meta.outputs.channel }}
        run: |
          # MSI/WiX only for final releases; beta testers use the NSIS setup.
          if ($env:CHANNEL -eq "release") {
            npx tauri build --bundles nsis,msi
          } else {
            npx tauri build --bundles nsis
          }

      - name: Collect packages and checksums
        shell: pwsh
        run: |
          mkdir dist-windows
          copy desktop\src-tauri\target\release\bundle\nsis\*.exe dist-windows\
          copy desktop\src-tauri\target\release\bundle\nsis\*.exe.sig dist-windows\
          $msi = "desktop\src-tauri\target\release\bundle\msi"
          if (Test-Path $msi) {
            copy "$msi\*.msi" dist-windows\
            copy "$msi\*.msi.sig" dist-windows\
          }
          cd dist-windows
          Get-ChildItem -File | Where-Object { $_.Name -ne 'SHA256SUMS.txt' } |
            Sort-Object Name |
            ForEach-Object {
              $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
              "$hash  $($_.Name)"
            } | Set-Content SHA256SUMS.txt
          type SHA256SUMS.txt

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: filepilot-windows-x86_64
          path: dist-windows/*
          if-no-files-found: error
          retention-days: 14

  release-artifacts:
    name: Prepare release artifacts
    needs: [meta, linux, windows]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: filepilot-linux-x86_64
          path: artifacts-linux
      - uses: actions/download-artifact@v4
        with:
          name: filepilot-windows-x86_64
          path: artifacts-windows
      - name: Combine artifacts
        run: |
          mkdir -p release-artifacts
          cp artifacts-linux/* release-artifacts/
          cp artifacts-windows/* release-artifacts/
          rm -f release-artifacts/SHA256SUMS.txt

      - name: Generate updater manifest
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          python3 - <<'PY'
          import datetime
          import glob
          import json
          import os
          import sys

          version = os.environ["VERSION"]
          tag = os.environ["TAG"] or f"v{version}"
          repo = os.environ["GITHUB_REPOSITORY"]
          base = f"https://github.com/{repo}/releases/download/{tag}"

          platforms = {}

          def add(key, pattern):
              matches = glob.glob(f"release-artifacts/{pattern}")
              if not matches:
                  return
              path = matches[0]
              sig = f"{path}.sig"
              if not os.path.exists(sig):
                  sys.exit(f"Missing signature for {path}")
              with open(sig, encoding="utf-8") as handle:
                  signature = handle.read().strip()
              platforms[key] = {
                  "signature": signature,
                  "url": f"{base}/{os.path.basename(path)}",
              }

          add("linux-x86_64", "*.AppImage")
          add("windows-x86_64", "*setup.exe")

          if not platforms:
              sys.exit("No updater artifacts found")

          manifest = {
              "version": version,
              "notes": f"FilePilot {version}",
              "pub_date": datetime.datetime.now(datetime.timezone.utc)
              .isoformat(timespec="seconds")
              .replace("+00:00", "Z"),
              "platforms": platforms,
          }
          with open("release-artifacts/latest.json", "w", encoding="utf-8") as handle:
              json.dump(manifest, handle, indent=2)
              handle.write("\n")
          print(json.dumps(manifest, indent=2))
          PY

      - name: Generate checksums
        run: |
          cd release-artifacts
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\n' |
            sort |
            xargs sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: filepilot-release-${{ needs.meta.outputs.version }}
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 30

  # Beta builds publish automatically so testing stays fast. They are marked as
  # prereleases, so `releases/latest` (and the in-app updater) still points at
  # the newest final release.
  publish-beta:
    name: Publish beta prerelease
    needs: [meta, release-artifacts]
    if: needs.meta.outputs.publish == 'true' && needs.meta.outputs.channel == 'beta'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: filepilot-release-${{ needs.meta.outputs.version }}
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: FilePilot ${{ needs.meta.outputs.version }} (beta)
          prerelease: true
          make_latest: false
          generate_release_notes: true
          files: artifacts/**/*
          fail_on_unmatched_files: true

  # Final releases are the "end version" and require a human approval on the
  # `release` environment before anything is published.
  publish-release:
    name: Publish final release
    needs: [meta, release-artifacts]
    if: needs.meta.outputs.publish == 'true' && needs.meta.outputs.channel == 'release'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    environment: release
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: filepilot-release-${{ needs.meta.outputs.version }}
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: FilePilot ${{ needs.meta.outputs.version }}
          prerelease: false
          make_latest: true
          generate_release_notes: true
          files: artifacts/**/*
          fail_on_unmatched_files: true
