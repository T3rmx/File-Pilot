<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ 'تسجيل الدخول' if lang == 'ar' else 'Login' }}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background-color: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 360px;
        }
        h2 {
            text-align: center;
            color: #333;
        }
        input[type="password"] {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        .error {
            color: #d32f2f;
            text-align: center;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>{{ 'تسجيل الدخول' if lang == 'ar' else 'Login' }}</h2>
        {% if error %}
            <p class="error">{{ 'كلمة المرور غير صحيحة' if lang == 'ar' else 'Incorrect password' }}</p>
        {% endif %}
        <form method="post">
            <input type="password" name="password" placeholder="{{ 'كلمة المرور' if lang == 'ar' else 'Password' }}" required>
            <button type="submit">{{ 'دخول' if lang == 'ar' else 'Login' }}</button>
        </form>
    </div>
</body>
</html>
