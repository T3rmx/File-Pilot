[package]
name = "filepilot"
version = "1.0.2"
description = "FilePilot desktop shell"
authors = ["FilePilot"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
serde_json = "1"
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2"