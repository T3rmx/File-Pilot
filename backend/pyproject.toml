[project]
name = "filepilot"
version = "1.0.2"
description = "Local-first file sharing for the LAN"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "websockets>=12",
  "sqlalchemy>=2.0",
  "pydantic-settings>=2.4",
  "argon2-cffi>=23.1",
  "python-multipart>=0.0.9",
  "segno>=1.6",
  "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
  "E501",  # formatting is handled by the formatter
  "B008",  # FastAPI expresses dependencies as Depends(...) defaults
  "UP017", # datetime.UTC is py3.11+, but the explicit form reads better here
]
